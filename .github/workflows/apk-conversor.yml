# Compila el APK de Android del conversor con el SDK oficial preinstalado en GitHub
# y lo publica en Releases para descargarlo e instalarlo en el teléfono.
name: APK del conversor

on:
  push:
    paths:
      - 'conversor/**'
      - '.github/workflows/apk-conversor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Plataforma y herramientas de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Compilar y firmar
        env:
          KS_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          # Si existe el secreto APK_KEYSTORE_B64 se firma siempre con la misma clave
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/clave.jks"; export KEYSTORE="$RUNNER_TEMP/clave.jks"; fi
          bash conversor/android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: conversor-apk
          path: conversor/android/build/conversor-mmol-mgdl-*.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls conversor/android/build/conversor-mmol-mgdl-*.apk)
          V=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' conversor/android/AndroidManifest.xml)
          TAG="conversor-android-v$V"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
            --title "Conversor mmol/L ↔ mg/dL $V para Android" \
            --notes "Instalador para Android 7.0 o superior. Descárguelo, páselo al teléfono y ábralo para instalar. No necesita internet para instalarse ni para abrirse. Compilado desde ${GITHUB_SHA::7}."
